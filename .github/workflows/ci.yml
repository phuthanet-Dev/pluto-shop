name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify local Compose bootstrap helper
        run: node --test scripts/dev-compose.test.mjs
      - name: Verify production configuration renderer
        run: npm run test:production-config
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and package API
        working-directory: apps/api
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

  compose-e2e:
    needs: [web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Create ephemeral Compose environment
        shell: bash
        run: |
          umask 077
          {
            printf 'POSTGRES_DB=plutoshop\n'
            printf 'POSTGRES_USER=pluto\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'POSTGRES_APP_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'POSTGRES_WRITE_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'POSTGRES_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'POSTGRES_INSPECTOR_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'KEYCLOAK_ADMIN=admin\n'
            printf 'KEYCLOAK_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'AUTH_SESSION_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'FULFILLMENT_SECURITY_ENCRYPTION_KEY_BASE64=%s\n' "$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
            printf 'FULFILLMENT_SECURITY_FINGERPRINT_KEY_BASE64=%s\n' "$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
            printf 'FULFILLMENT_SECURITY_KEY_VERSION=1\n'
            printf 'OIDC_ISSUER=http://127.0.0.1:8081/realms/pluto\n'
            printf 'OIDC_INTERNAL_ISSUER=http://keycloak:8080/realms/pluto\n'
            printf 'OIDC_CLIENT_ID=pluto-web\n'
            printf 'OIDC_REDIRECT_URI=http://127.0.0.1:3000/api/auth/callback\n'
            printf 'WEB_PORT=3000\n'
          } > .env
      - name: Build and start healthy stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Verify exact source catalog and same-origin proxy
        run: npm run test:catalog
      - name: Verify runtime database role is read-only
        shell: bash
        run: |
          docker compose exec -T api sh -ec 'test "$SPRING_FLYWAY_ENABLED" = "false"; test -z "${SPRING_FLYWAY_USER:-}"; test -z "${SPRING_FLYWAY_PASSWORD:-}"; test "$SPRING_DATASOURCE_USERNAME" = "pluto_user"; test "$SPRING_DATASOURCE_ADMIN_USERNAME" = "pluto_admin"'
          count="$(docker compose exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_APP_PASSWORD" exec psql --host 127.0.0.1 --no-align --tuples-only --username pluto_app --dbname "$POSTGRES_DB" --command "SELECT count(*) FROM products"')"
          test "$count" = "36"
          if docker compose exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_APP_PASSWORD" exec psql --host 127.0.0.1 --set ON_ERROR_STOP=1 --username pluto_app --dbname "$POSTGRES_DB" --command "UPDATE products SET catalog_order = catalog_order WHERE false"'; then
            echo 'pluto_app unexpectedly has write permission' >&2
            exit 1
          fi
          if docker compose exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_WRITE_PASSWORD" exec psql --host 127.0.0.1 --set ON_ERROR_STOP=1 --username pluto_user --dbname "$POSTGRES_DB" --command "UPDATE products SET catalog_order = catalog_order WHERE false"'; then
            echo 'pluto_user unexpectedly has product write permission' >&2
            exit 1
          fi
          docker compose exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" exec psql --host 127.0.0.1 --set ON_ERROR_STOP=1 --username pluto_admin --dbname "$POSTGRES_DB" --command "UPDATE products SET catalog_order = catalog_order WHERE false"'
          user_count="$(docker compose exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_WRITE_PASSWORD" exec psql --host 127.0.0.1 --no-align --tuples-only --username pluto_user --dbname "$POSTGRES_DB" --command "SELECT count(*) FROM app_users"')"
          test "$user_count" = "0"
      - name: Run browser integration tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  container-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, api, compose-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set image namespace
        shell: bash
        run: echo "IMAGE_BASE=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        shell: bash
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build web image
        run: docker build --pull --build-arg INTERNAL_API_URL=http://api:8080 --tag "$IMAGE_BASE-web:$GITHUB_SHA" --file apps/web/Dockerfile .
      - name: Build API image
        run: docker build --pull --tag "$IMAGE_BASE-api:$GITHUB_SHA" apps/api
      - name: Build Keycloak image
        run: docker build --pull --tag "$IMAGE_BASE-keycloak:$GITHUB_SHA" infra/keycloak
      - name: Push immutable images
        run: |
          docker push "$IMAGE_BASE-web:$GITHUB_SHA"
          docker push "$IMAGE_BASE-api:$GITHUB_SHA"
          docker push "$IMAGE_BASE-keycloak:$GITHUB_SHA"
