spring:
  application:
    name: plutoshop-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      read-only: ${SPRING_DATASOURCE_READ_ONLY:true}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  servlet:
    multipart:
      max-file-size: ${PRODUCT_IMAGE_MAX_FILE_SIZE:6MB}
      max-request-size: ${PRODUCT_IMAGE_MAX_REQUEST_SIZE:6MB}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    clean-disabled: true
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          audience: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCE:}

server:
  shutdown: graceful
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

product-media:
  root: ${PRODUCT_MEDIA_ROOT:/var/lib/plutoshop/product-media}

fulfillment:
  security:
    encryption-key-base64: ${FULFILLMENT_SECURITY_ENCRYPTION_KEY_BASE64:}
    encryption-key-ring: ${FULFILLMENT_SECURITY_ENCRYPTION_KEY_RING:}
    fingerprint-key-base64: ${FULFILLMENT_SECURITY_FINGERPRINT_KEY_BASE64:}
    fingerprint-key-ring: ${FULFILLMENT_SECURITY_FINGERPRINT_KEY_RING:}
    key-version: ${FULFILLMENT_SECURITY_KEY_VERSION:1}
  delivery:
    enabled: ${FULFILLMENT_DELIVERY_ENABLED:false}
    batch-size: ${FULFILLMENT_DELIVERY_BATCH_SIZE:20}
    fixed-delay-ms: ${FULFILLMENT_DELIVERY_FIXED_DELAY_MS:5000}
    initial-delay-ms: ${FULFILLMENT_DELIVERY_INITIAL_DELAY_MS:5000}
    max-attempts: ${FULFILLMENT_DELIVERY_MAX_ATTEMPTS:5}
    backoff-base-seconds: ${FULFILLMENT_DELIVERY_BACKOFF_BASE_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF

payment:
  inwcloud:
    api-base-url: ${INWCLOUD_API_BASE_URL:https://api.inwcloud.shop}
    api-key: ${INWCLOUD_API_KEY:}
    promptpay-blackout-enforced: ${INWCLOUD_PROMPTPAY_BLACKOUT_ENFORCED:true}
    expiry-sweep-enabled: ${INWCLOUD_PAYMENT_EXPIRY_SWEEP_ENABLED:true}
    expiry-sweep-delay-ms: ${INWCLOUD_PAYMENT_EXPIRY_SWEEP_DELAY_MS:60000}
    expiry-sweep-initial-delay-ms: ${INWCLOUD_PAYMENT_EXPIRY_SWEEP_INITIAL_DELAY_MS:60000}
