name: pluto-shop

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run dev:docker to create .env}
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run dev:docker to create .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run dev:docker to create .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run npm run dev:docker to create .env}
      POSTGRES_WRITE_PASSWORD: ${POSTGRES_WRITE_PASSWORD:?Run npm run dev:docker to create .env}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run npm run dev:docker to create .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Run npm run dev:docker to create .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run npm run dev:docker to create .env}
      KC_HOSTNAME: http://127.0.0.1:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    init: true
    tmpfs:
      - /opt/keycloak/data/tmp:size=64m,mode=1777
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app
    restart: unless-stopped

  role-bootstrap:
    image: postgres:18.6
    environment:
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run dev:docker to create .env}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run dev:docker to create .env}
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run dev:docker to create .env}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run npm run dev:docker to create .env}
    command: ["bash", "/usr/local/bin/bootstrap-roles.sh"]
    volumes:
      - ./infra/postgres/bootstrap-roles.sh:/usr/local/bin/bootstrap-roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data
    restart: "no"

  migrate:
    build:
      context: ./apps/api
    image: pluto-shop-api:local
    command: ["--spring.main.web-application-type=none"]
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_FLYWAY_ENABLED: "true"
      INWCLOUD_PAYMENT_EXPIRY_SWEEP_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_ADMIN_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_ADMIN_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_USER: ${POSTGRES_USER}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      role-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data
    restart: "no"

  api:
    image: pluto-shop-api:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: pluto_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_WRITE_PASSWORD}
      SPRING_DATASOURCE_ADMIN_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_ADMIN_USERNAME: pluto_admin
      SPRING_DATASOURCE_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      SPRING_DATASOURCE_READ_ONLY: "false"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://127.0.0.1:8081/realms/pluto
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/pluto/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCE: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCE:-pluto-api}
      INWCLOUD_API_BASE_URL: ${INWCLOUD_API_BASE_URL:-https://api.inwcloud.shop}
      INWCLOUD_API_KEY: ${INWCLOUD_API_KEY-}
      SERVER_PORT: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "java", "-cp", "/opt/app/healthcheck", "com.plutoshop.api.ContainerHealthCheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app
      - data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:8080
    environment:
      INTERNAL_API_URL: http://api:8080
      OIDC_ISSUER: http://127.0.0.1:8081/realms/pluto
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/pluto
      OIDC_CLIENT_ID: pluto-web
      OIDC_REDIRECT_URI: http://127.0.0.1:3000/api/auth/callback
      SITE_URL: http://127.0.0.1:3000
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?Run npm run dev:docker to create .env}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/th"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=128m,uid=1000,gid=1000,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app
    restart: unless-stopped

volumes:
  postgres-data:
  keycloak-data:

networks:
  app:
  data:
    internal: true
