name: pluto-shop-edge
services:
  caddy:
    image: caddy:2.9.1-alpine
    network_mode: host
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  caddy-data:
    external: true
    name: pluto-shop-production_caddy-data
  caddy-config:
    external: true
    name: pluto-shop-production_caddy-config
